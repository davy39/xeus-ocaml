context:
  version: 0.2.10      # Single source: pixi.toml [workspace].version
  ocaml_version: 5.5.0 # Single source: pixi.toml [workspace].ocaml_version

package:
  name: xeus-ocaml
  version: ${{ version }}

source:
- path: ../

requirements:
  build:
  - ${{ compiler("cxx") }}
  - cmake
  - make
  - ninja
  - opam
  host:
  - nlohmann_json
  - xeus
  - xeus-lite



build:
  number: 0

  script:
  - |
    (
      # --- Disable OCaml-related wasm flags: OCaml needs native builders ---
      unset CC CXX CFLAGS CXXFLAGS LDFLAGS OPAMSWITCH
      # --- Private opam root built into the source tree (no cross-build caching) ---
      export OPAMROOT=$SRC_DIR/opam_root

      cd ocaml
      opam init --disable-sandboxing --no --compiler=${{ ocaml_version }}
      opam install dune
      opam exec -- dune pkg lock
      opam exec -- dune build --profile release
    )


  - rm -rf ocaml-build
  - mkdir -p ocaml-build
  - cp -r ocaml/_build/default/src/* ocaml-build/
    # =========================================================================
    # PHASE 2: Build the WASM kernel into the source tree
    # =========================================================================
  - mkdir -p build-cmake
  - cd build-cmake

    # Configure CMake from the new directory, pointing back to the source.
    # The `-S` flag in modern CMake is perfect for this.
  - |
    # Clear the host (native) LDFLAGS: CMake reads LDFLAGS into the linker flags,
    # and the native `-Wl,--no-pie/--sort-common/--as-needed` flags are rejected
    # by wasm-ld.
    unset LDFLAGS
    # wasm-opt (binaryen) has no rpath; it needs the build/link env libs.
    export LD_LIBRARY_PATH="$PREFIX/lib:$BUILD_PREFIX/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
    cmake -S $SRC_DIR -GNinja ${CMAKE_ARGS}    \
        -DCMAKE_BUILD_TYPE=release             \
        -DCMAKE_PREFIX_PATH=$PREFIX            \
        -DCMAKE_INSTALL_PREFIX=$PREFIX

    # Compile and install. Ninja will only rebuild what has changed.
  - ninja install



tests:
- script:
  - test -f $PREFIX/bin/xocaml.wasm
  - test -f $PREFIX/bin/xocaml.js
about:
  license: GPL-3.0-or-later
  license_file: LICENSE
  summary: xeus-ocaml
  homepage: https://github.com/davy39/xeus-ocaml
extra:
  recipe-maintainers:
  - Davy39
